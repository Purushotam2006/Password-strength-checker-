<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Strength Checker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Password Strength Checker</h1>

        <p class="subtitle">
            Check how strong your password is
        </p>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button id="showPassword">Show</button>

        </div>

        <div class="strength-container">

            <div class="strength-bar">
                <div id="strengthBar"></div>
            </div>

            <h2 id="strengthText">Enter a password</h2>

        </div>

        <div class="requirements">

            <h3>Password Requirements</h3>

            <p id="length">✗ At least 8 characters</p>
            <p id="uppercase">✗ Uppercase letter</p>
            <p id="lowercase">✗ Lowercase letter</p>
            <p id="number">✗ Number</p>
            <p id="special">✗ Special character</p>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
